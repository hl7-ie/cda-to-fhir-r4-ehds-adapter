name: .NET CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-ci.yml"

jobs:
  build-and-test:
    name: Build, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore CdaToFhirAdapter.slnx
        working-directory: dotnet

      - name: Build solution
        run: dotnet build CdaToFhirAdapter.slnx --configuration Release --no-restore
        working-directory: dotnet

      - name: Run unit tests
        run: |
          dotnet test CdaToFhirAdapter.slnx \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage"
        working-directory: dotnet

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: .NET Unit Tests
          path: dotnet/tests/**/*.trx
          reporter: dotnet-trx

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: dotnet/tests/**/coverage.cobertura.xml

  security-audit:
    name: Security Audit (NuGet)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run vulnerability audit
        run: dotnet list dotnet/CdaToFhirAdapter.slnx package --vulnerable --include-transitive 2>&1
        continue-on-error: true

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: |
          docker build \
            -t cda-to-fhir-adapter-api:${{ github.sha }} \
            -f dotnet/src/CdaToFhirAdapter.Api/Dockerfile \
            dotnet/

      - name: Build CLI Docker image
        run: |
          docker build \
            -t cda-to-fhir-adapter-cli:${{ github.sha }} \
            -f dotnet/src/CdaToFhirAdapter.Cli/Dockerfile \
            dotnet/
