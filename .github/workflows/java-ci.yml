name: Java CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "java/**"
      - ".github/workflows/java-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "java/**"
      - ".github/workflows/java-ci.yml"

jobs:
  build-and-test:
    name: Build, Checkstyle, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate checkstyle
        run: mvn checkstyle:check --batch-mode
        working-directory: java

      - name: Build
        run: mvn compile --batch-mode -DskipTests
        working-directory: java

      - name: Run unit tests
        run: mvn test --batch-mode
        working-directory: java

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Java Unit Tests
          path: java/target/surefire-reports/*.xml
          reporter: java-junit

  spotbugs:
    name: SpotBugs Static Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run SpotBugs
        run: mvn spotbugs:check --batch-mode -DskipTests
        working-directory: java

  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run OWASP dependency check
        run: |
          mvn dependency-check:check --batch-mode \
            -DskipTests \
            -Dnvd.api.key=${{ secrets.NVD_API_KEY }}
        working-directory: java
        env:
          JAVA_OPTS: "-Xmx2g"

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: java/target/dependency-check-report.html

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build fat JAR
        run: mvn package --batch-mode -DskipTests
        working-directory: java

      - name: Build Docker image
        run: docker build -t cda-to-fhir-adapter-java:${{ github.sha }} java/
